# git-cliff configuration: release notes for the GitHub Releases that
# .github/workflows/release.yml publishes for each green build of main.
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
# One release's notes, grouped Keep a Changelog style.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% else %}
No user-facing changes.
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^(refactor|perf)", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = ".*", skip = true },
]
protect_breaking_commits = true
filter_commits = false
# Release tags: the build's UTC commit date and short hash, e.g.
# 2026.11.14-1722-4e909b4 (`switchyard --version` prints the same build as
# "2026-11-14 17:22 UTC (4e909b4)").
tag_pattern = "^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-[0-9]{4}-[0-9a-f]{7}$"
sort_commits = "oldest"
