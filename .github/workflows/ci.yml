name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-darwin
            runner: macos-15
          - system: x86_64-linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: johnallen3d
          skipPush: true
      - name: Verify native runner
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
      - name: Build exported package (including package checks)
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: nix build --no-update-lock-file --print-build-logs ".#packages.${NIX_SYSTEM}.default"
      # PRs (including same-repo PRs) never receive the upload token.
      # Manual dispatches on main publish too, so they can force a fresh build.
      # Push only the successful package's closure, not arbitrary store paths.
      - name: Publish trusted main build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::CACHIX_AUTH_TOKEN is required to publish trusted main builds"
            exit 1
          fi
          cachix push johnallen3d ./result
