# Switchyard: the Rex float tools (see nix/package.nix). Library crates
# hold what the tools share; each binary crate is one tool.
#
#   crates/ui          palette, glyphs, chrome, list drawing, float protocol
#   crates/core        Rex and SSH calls, hosts and catalog, task registry,
#                      launches and task actions
#   crates/tab-picker  rex-tab-picker (cmd+k tabs, agents and archive;
#                      standalone from a shell)
#   crates/spawn       rex-spawn (cmd+shift+n, ctrl+cmd+n, plus --tasks and --act)
#   crates/server      switchyard-server (rows and tasks kept current from Rex
#                      events, served on a Unix socket)
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
switchyard-core = { path = "crates/core" }
switchyard-ui = { path = "crates/ui" }
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
unicode-width = "0.2"
